
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vitals Monitor</title>

<style>

:root{
  --bg:#050706;
  --panel:#0c1210;
  --panel-line:#1c2622;
  --text:#dce7e2;
  --text-dim:#6f8b83;
  --bpm:#3ef58a;
  --temp:#ffb648;
  --bad:#ff5d5d;
  --off:#2a3530;

  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
}

*{
  box-sizing:border-box;
}

html,
body{
  height:100%;
  margin:0;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:24px;
}

.wrap{
  width:100%;
  max-width:380px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:28px;
}

.brand-mark{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--bpm);

  box-shadow:0 0 8px var(--bpm);

  animation:pulse 1.4s infinite ease-in-out;
}

@keyframes pulse{
  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.35;
  }
}

.brand-name{
  font-family:var(--mono);
  font-size:14px;
  letter-spacing:.04em;
  color:var(--text-dim);
}

.card{
  background:var(--panel);
  border:1px solid var(--panel-line);
  border-radius:4px;
  padding:28px;
}

.card h1{
  font-size:20px;
  margin:0 0 4px;
  font-weight:600;
}

.card p.sub{
  margin:0 0 24px;
  color:var(--text-dim);
  font-size:13px;
  line-height:1.5;
}

label{
  display:block;
  font-size:12px;
  color:var(--text-dim);
  margin-bottom:6px;
}

.field{
  margin-bottom:16px;
}

input{
  width:100%;
  background:#060a09;
  border:1px solid var(--panel-line);
  color:var(--text);

  border-radius:3px;
  padding:10px 12px;

  font-size:14px;
  font-family:var(--sans);
}

input:focus{
  outline:none;
  border-color:var(--bpm);
}

button.primary{
  width:100%;
  background:var(--bpm);
  color:#04140a;

  border:none;
  border-radius:3px;

  padding:11px 12px;

  font-size:14px;
  font-weight:600;

  cursor:pointer;
  margin-top:6px;
}

button.primary:hover{
  filter:brightness(1.08);
}

button.primary:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.result{
  margin-top:18px;
  padding:12px 14px;

  border-radius:3px;

  font-size:13.5px;

  font-family:var(--mono);

  display:none;
}

.result.bad{
  display:block;

  background:rgba(255,93,93,.08);
  border:1px solid rgba(255,93,93,.4);

  color:var(--bad);
}


/* DASHBOARD */

.dash-wrap{
  display:none;

  width:100%;
  max-width:560px;
}

.dash-header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:20px;
}

.dash-header .who{
  font-size:12.5px;
  color:var(--text-dim);
}

.dash-header .who span{
  color:var(--text);
}

.logout-btn{
  background:none;

  border:1px solid var(--panel-line);

  color:var(--text-dim);

  font-size:12px;

  padding:6px 12px;

  border-radius:3px;

  cursor:pointer;
}

.logout-btn:hover{
  color:var(--text);
  border-color:var(--text-dim);
}


/* VITALS */

.vitals-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;

  margin-bottom:14px;
}

.vital-card{
  background:var(--panel);

  border:1px solid var(--panel-line);

  border-radius:4px;

  padding:20px;
}

.vital-label{
  font-size:11.5px;

  color:var(--text-dim);

  margin-bottom:10px;
}

.vital-value{
  font-family:var(--mono);

  font-size:40px;

  line-height:1;

  font-weight:500;
}

.vital-value .unit{
  font-size:16px;

  color:var(--text-dim);

  margin-left:4px;
}

.vital-value.bpm{
  color:var(--bpm);
}

.vital-value.temp{
  color:var(--temp);
}

.vital-updated{
  font-size:11px;

  color:var(--text-dim);

  margin-top:10px;

  font-family:var(--mono);
}


/* CONTROLS */

.controls-card{
  background:var(--panel);

  border:1px solid var(--panel-line);

  border-radius:4px;

  padding:20px;
}

.controls-title{
  font-size:11.5px;

  color:var(--text-dim);

  margin-bottom:16px;
}

.control-row{
  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:12px 0;

  border-top:1px solid var(--panel-line);
}

.control-row:first-of-type{
  border-top:none;

  padding-top:0;
}

.control-label{
  display:flex;

  align-items:center;

  gap:10px;

  font-size:14px;
}

.indicator{
  width:14px;
  height:14px;

  border-radius:50%;

  background:var(--off);

  transition:
    background .15s,
    box-shadow .15s;
}

.indicator.buzzer-on{
  background:var(--bad);

  box-shadow:0 0 10px var(--bad);
}

.indicator.led-on{
  background:#ffe066;

  box-shadow:0 0 10px #ffe066;
}

.toggle{
  position:relative;

  width:44px;
  height:24px;

  background:var(--off);

  border-radius:12px;

  border:none;

  cursor:pointer;

  transition:background .15s;
}

.toggle::after{
  content:"";

  position:absolute;

  top:3px;
  left:3px;

  width:18px;
  height:18px;

  background:var(--text);

  border-radius:50%;

  transition:transform .15s;
}

.toggle.on{
  background:var(--bpm);
}

.toggle.on::after{
  transform:translateX(20px);

  background:#04140a;
}


/* =========================================
   NOTIFICATION SECTION
========================================= */

.notify-card{
  background:var(--panel);

  border:1px solid var(--panel-line);

  border-radius:4px;

  padding:20px;

  margin-top:14px;
}

.notify-header{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:15px;
}

.notify-title{
  font-size:11.5px;

  color:var(--text-dim);
}

.add-notify{
  background:var(--bpm);

  color:#04140a;

  border:none;

  padding:8px 12px;

  border-radius:3px;

  cursor:pointer;

  font-weight:600;
}

.add-notify:hover{
  filter:brightness(1.08);
}


/* FORM */

.notify-form{
  display:none;

  border-top:1px solid var(--panel-line);

  padding-top:15px;

  margin-bottom:10px;
}

.time-row{
  display:grid;

  grid-template-columns:1fr 1fr 1fr;

  gap:6px;

  margin-bottom:10px;
}

.time-row select,
.notify-message{
  background:#060a09;

  color:var(--text);

  border:1px solid var(--panel-line);

  border-radius:3px;

  padding:10px;

  font-family:var(--sans);
}

.time-row select{
  width:100%;
}

.notify-message{
  width:100%;

  font-size:14px;
}

.time-row select:focus,
.notify-message:focus{
  outline:none;

  border-color:var(--bpm);
}

.notify-save,
.notify-cancel{
  margin-top:10px;

  padding:8px 12px;

  border:none;

  border-radius:3px;

  cursor:pointer;
}

.notify-save{
  background:var(--bpm);

  color:#04140a;

  font-weight:600;
}

.notify-cancel{
  background:var(--off);

  color:var(--text);
}


/* NOTIFICATION LIST */

.notify-item{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  padding:13px 0;

  border-top:1px solid var(--panel-line);
}

.notify-info{
  flex:1;
}

.notify-time{
  font-family:var(--mono);

  color:var(--bpm);

  font-size:15px;
}

.notify-message-display{
  color:var(--text-dim);

  font-size:12px;

  margin-top:4px;
}

.notify-actions{
  display:flex;

  gap:5px;
}

.notify-edit,
.notify-delete{
  background:none;

  border:1px solid var(--panel-line);

  color:var(--text-dim);

  padding:5px 8px;

  cursor:pointer;

  border-radius:3px;
}

.notify-edit:hover{
  color:var(--bpm);

  border-color:var(--bpm);
}

.notify-delete:hover{
  color:var(--bad);

  border-color:var(--bad);
}

.empty-notifications{
  color:var(--text-dim);

  font-size:12px;

  padding-top:5px;
}


/* CONNECTION */

.conn-status{
  display:flex;

  align-items:center;

  gap:7px;

  font-size:12px;

  color:var(--text-dim);

  margin-top:16px;
}

.conn-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--text-dim);
}

.conn-dot.live{
  background:var(--bpm);

  box-shadow:0 0 6px var(--bpm);
}

.conn-dot.stale{
  background:var(--bad);
}


/* MOBILE */

@media(max-width:420px){

  .vitals-grid{
    grid-template-columns:1fr;
  }

  .notify-item{
    align-items:flex-start;
  }

  .notify-actions{
    flex-direction:column;
  }

}

</style>
</head>


<body>

<!-- =========================================
     FIREBASE + JAVASCRIPT
========================================= -->

<script type="module">


/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getDatabase,
  ref,
  onValue,
  set,
  push,
  remove
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDM5_3qmJVfWc9kF6qHBf4ojWbym4PyX4A",

  authDomain:
    "netvital.firebaseapp.com",

  databaseURL:
    "https://netvital-default-rtdb.asia-southeast1.firebasedatabase.app/",

  projectId:
    "netvital",

  appId:
    "1:305975124083:web:b9f5ec7adc1497766d0a06"

};



const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getDatabase(app);



/* =========================================
   LOGIN
========================================= */

const MOCK_USERNAME =
  "patient_vital";

const MOCK_PASSWORD =
  "iotwork462";


const authWrap =
  document.getElementById("authWrap");

const dashWrap =
  document.getElementById("dashWrap");

const usernameInput =
  document.getElementById("username");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const result =
  document.getElementById("result");

const logoutBtn =
  document.getElementById("logoutBtn");



loginBtn.addEventListener(
  "click",
  handleLogin
);


passwordInput.addEventListener(
  "keydown",
  (e) => {

    if (e.key === "Enter") {

      handleLogin();

    }

  }
);



async function handleLogin(){

  const u =
    usernameInput.value.trim();

  const p =
    passwordInput.value;


  if (
    u !== MOCK_USERNAME ||
    p !== MOCK_PASSWORD
  ){

    result.style.display =
      "block";

    result.textContent =
      "✘ Incorrect username or password.";

    return;

  }


  result.style.display =
    "none";

  loginBtn.disabled =
    true;


  try{

    await signInAnonymously(auth);

  }

  catch(err){

    result.style.display =
      "block";

    result.textContent =
      "Could not connect to the database. Check your Firebase config.";

    console.error(err);

  }

  finally{

    loginBtn.disabled =
      false;

  }

}



/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
  "click",
  async () => {

    await signOut(auth);

    dashWrap.style.display =
      "none";

    authWrap.style.display =
      "block";

    usernameInput.value =
      "";

    passwordInput.value =
      "";

  }
);



/* =========================================
   FIREBASE AUTH STATE
========================================= */

onAuthStateChanged(
  auth,
  (user) => {

    if(user){

      authWrap.style.display =
        "none";

      dashWrap.style.display =
        "block";

      attachVitalsListener();

      attachControlsListener();

      attachNotificationsListener();

    }

  }
);



/* =========================================
   VITALS
========================================= */

const bpmValue =
  document.getElementById("bpmValue");

const tempValue =
  document.getElementById("tempValue");

const bpmUpdated =
  document.getElementById("bpmUpdated");

const tempUpdated =
  document.getElementById("tempUpdated");

const connDot =
  document.getElementById("connDot");

const connLabel =
  document.getElementById("connLabel");


let vitalsAttached =
  false;



function timeAgo(ts){

  if(!ts){

    return "no data yet";

  }


  const s =
    Math.floor(
      (Date.now() - ts) / 1000
    );


  if(s < 60){

    return `${s}s ago`;

  }


  if(s < 3600){

    return `${Math.floor(s / 60)}m ago`;

  }


  return `${Math.floor(s / 3600)}h ago`;

}



function attachVitalsListener(){

  if(vitalsAttached){

    return;

  }


  vitalsAttached =
    true;


  onValue(
    ref(db, "vitals"),

    (snap) => {

      const data =
        snap.val();


      if(!data){

        connDot.className =
          "conn-dot stale";

        connLabel.textContent =
          "No data at /vitals yet.";

        return;

      }


      bpmValue.textContent =
        data.bpm ?? "--";


      tempValue.textContent =
        data.temp !== undefined
          ? Number(data.temp).toFixed(1)
          : "--";


      bpmUpdated.textContent =
        timeAgo(data.timestamp);


      tempUpdated.textContent =
        timeAgo(data.timestamp);


      const age =
        data.timestamp
          ? Date.now() - data.timestamp
          : Infinity;


      if(age < 15000){

        connDot.className =
          "conn-dot live";

        connLabel.textContent =
          "Live";

      }

      else{

        connDot.className =
          "conn-dot stale";

        connLabel.textContent =
          "Last reading is stale";

      }

    },

    (err) => {

      connDot.className =
        "conn-dot stale";

      connLabel.textContent =
        "Database read failed — check rules/config.";

      console.error(err);

    }

  );

}



/* =========================================
   DEVICE CONTROLS
========================================= */

const buzzerToggle =
  document.getElementById("buzzerToggle");

const ledToggle =
  document.getElementById("ledToggle");

const buzzerIndicator =
  document.getElementById("buzzerIndicator");

const ledIndicator =
  document.getElementById("ledIndicator");


let controlsAttached =
  false;



function attachControlsListener(){

  if(controlsAttached){

    return;

  }


  controlsAttached =
    true;


  onValue(
    ref(db, "controls"),

    (snap) => {

      const data =
        snap.val() || {};


      buzzerToggle.classList.toggle(
        "on",
        !!data.buzzer
      );


      buzzerIndicator.classList.toggle(
        "buzzer-on",
        !!data.buzzer
      );


      ledToggle.classList.toggle(
        "on",
        !!data.led
      );


      ledIndicator.classList.toggle(
        "led-on",
        !!data.led
      );

    }

  );

}



buzzerToggle.addEventListener(
  "click",
  () => {

    const next =
      !buzzerToggle.classList.contains("on");

    set(
      ref(db, "controls/buzzer"),
      next
    );

  }
);



ledToggle.addEventListener(
  "click",
  () => {

    const next =
      !ledToggle.classList.contains("on");

    set(
      ref(db, "controls/led"),
      next
    );

  }
);



/* =========================================
   NOTIFICATION SYSTEM
   Firebase Realtime Database version
   ========================================= */

const addNotifyBtn =
  document.getElementById("addNotifyBtn");

const saveNotifyBtn =
  document.getElementById("saveNotifyBtn");

const cancelNotifyBtn =
  document.getElementById("cancelNotifyBtn");

const notifyForm =
  document.getElementById("notifyForm");

const notifyList =
  document.getElementById("notifyList");

const notifyHour =
  document.getElementById("notifyHour");

const notifyMinute =
  document.getElementById("notifyMinute");

const notifyAmPm =
  document.getElementById("notifyAmPm");

const notifyMessage =
  document.getElementById("notifyMessage");

let scheduledNotifications = [];
let notificationTimers = {};
let editingNotificationId = null;
let notificationsAttached = false;

/* =========================================
   LOAD NOTIFICATIONS FROM FIREBASE
   ========================================= */

function attachNotificationsListener(){

  if(notificationsAttached){
    return;
  }

  notificationsAttached = true;

  onValue(
    ref(db, "notifications"),
    (snap) => {

      const data = snap.val() || {};

      scheduledNotifications =
        Object.entries(data).map(([id, item]) => ({
          id,
          time: item.time || "00:00",
          message: item.message || ""
        }));

      scheduledNotifications.sort(
        (a, b) => a.time.localeCompare(b.time)
      );

      renderNotifications();
      scheduleAllNotifications();

    },
    (err) => {

      console.error("Notification database read failed:", err);

      notifyList.innerHTML =
        '<div class="empty-notifications">Could not load notifications from Firebase.</div>';

    }
  );
}


/* =========================================
   ADD BUTTON
   ========================================= */

addNotifyBtn.addEventListener(
  "click",
  () => {

    editingNotificationId = null;

    notifyHour.value = "12";
    notifyMinute.value = "0";
    notifyAmPm.value = "AM";
    notifyMessage.value = "";

    notifyForm.style.display = "block";
    notifyMessage.focus();

  }
);


/* =========================================
   CANCEL BUTTON
   ========================================= */

cancelNotifyBtn.addEventListener(
  "click",
  () => {

    editingNotificationId = null;
    notifyForm.style.display = "none";

  }
);


/* =========================================
   SAVE BUTTON
   Save directly to Firebase
   ========================================= */

saveNotifyBtn.addEventListener(
  "click",
  async () => {

    const message =
      notifyMessage.value.trim();

    if(!message){

      alert("Please enter a notification message.");
      return;

    }

    if(!auth.currentUser){

      alert("Please sign in first.");
      return;

    }

    if(!("Notification" in window)){

      alert("This browser does not support notifications.");
      return;

    }

    if(Notification.permission !== "granted"){

      const permission =
        await Notification.requestPermission();

      if(permission !== "granted"){

        alert("Please allow notifications in your browser.");
        return;

      }

    }

    let hour =
      Number(notifyHour.value);

    const minute =
      Number(notifyMinute.value);

    const ampm =
      notifyAmPm.value;

    /* Convert 12-hour to 24-hour */

    if(ampm === "AM"){

      if(hour === 12){
        hour = 0;
      }

    }
    else{

      if(hour !== 12){
        hour += 12;
      }

    }

    const time =
      String(hour).padStart(2,"0") +
      ":" +
      String(minute).padStart(2,"0");

    try{

      if(editingNotificationId){

        /* UPDATE EXISTING FIREBASE RECORD */

        await set(
          ref(
            db,
            "notifications/" +
            editingNotificationId
          ),
          {
            time: time,
            message: message
          }
        );

      }
      else{

        /* CREATE NEW FIREBASE RECORD */

        const newRef =
          push(ref(db, "notifications"));

        await set(
          newRef,
          {
            time: time,
            message: message,
            createdAt: Date.now()
          }
        );

      }

      notifyForm.style.display = "none";
      editingNotificationId = null;

    }
    catch(err){

      console.error("Could not save notification:", err);

      alert(
        "Could not save notification to Firebase. Check your Database Rules."
      );

    }

  }
);


/* =========================================
   FORMAT 12-HOUR TIME
   ========================================= */

function formatTime(time){

  const parts =
    time.split(":");

  let hour =
    Number(parts[0]);

  const minute =
    parts[1];

  const ampm =
    hour >= 12 ? "PM" : "AM";

  hour =
    hour % 12;

  if(hour === 0){
    hour = 12;
  }

  return (
    String(hour).padStart(2,"0") +
    ":" +
    minute +
    " " +
    ampm
  );

}


/* =========================================
   DISPLAY NOTIFICATIONS
   ========================================= */

function renderNotifications(){

  notifyList.innerHTML = "";

  if(scheduledNotifications.length === 0){

    notifyList.innerHTML =
      '<div class="empty-notifications">No notifications scheduled.</div>';

    return;

  }

  scheduledNotifications.forEach(
    item => {

      const row =
        document.createElement("div");

      row.className =
        "notify-item";

      const info =
        document.createElement("div");

      info.className =
        "notify-info";

      const time =
        document.createElement("div");

      time.className =
        "notify-time";

      time.textContent =
        formatTime(item.time);

      const message =
        document.createElement("div");

      message.className =
        "notify-message-display";

      message.textContent =
        item.message;

      info.appendChild(time);
      info.appendChild(message);

      const actions =
        document.createElement("div");

      actions.className =
        "notify-actions";

      const edit =
        document.createElement("button");

      edit.className =
        "notify-edit";

      edit.textContent =
        "Edit";

      edit.addEventListener(
        "click",
        () => {
          editNotification(item.id);
        }
      );

      const removeBtn =
        document.createElement("button");

      removeBtn.className =
        "notify-delete";

      removeBtn.textContent =
        "Delete";

      removeBtn.addEventListener(
        "click",
        () => {
          deleteNotification(item.id);
        }
      );

      actions.appendChild(edit);
      actions.appendChild(removeBtn);

      row.appendChild(info);
      row.appendChild(actions);

      notifyList.appendChild(row);

    }
  );

}


/* =========================================
   EDIT
   ========================================= */

function editNotification(id){

  const item =
    scheduledNotifications.find(
      n => n.id === id
    );

  if(!item){
    return;
  }

  editingNotificationId =
    id;

  const parts =
    item.time.split(":");

  let hour =
    Number(parts[0]);

  const minute =
    Number(parts[1]);

  const ampm =
    hour >= 12 ? "PM" : "AM";

  hour =
    hour % 12;

  if(hour === 0){
    hour = 12;
  }

  notifyHour.value =
    String(hour);

  notifyMinute.value =
    String(minute);

  notifyAmPm.value =
    ampm;

  notifyMessage.value =
    item.message;

  notifyForm.style.display =
    "block";

  notifyMessage.focus();

}


/* =========================================
   DELETE
   ========================================= */

async function deleteNotification(id){

  const ok =
    confirm("Delete this notification?");

  if(!ok){
    return;
  }

  try{

    clearTimeout(
      notificationTimers[id]
    );

    delete notificationTimers[id];

    await remove(
      ref(
        db,
        "notifications/" + id
      )
    );

  }
  catch(err){

    console.error(
      "Could not delete notification:",
      err
    );

    alert(
      "Could not delete notification from Firebase."
    );

  }

}


/* =========================================
   SCHEDULE ALL
   ========================================= */

function scheduleAllNotifications(){

  Object.values(
    notificationTimers
  ).forEach(
    timer => {
      clearTimeout(timer);
    }
  );

  notificationTimers = {};

  scheduledNotifications.forEach(
    item => {
      scheduleNotification(item);
    }
  );

}


/* =========================================
   SCHEDULE ONE
   ========================================= */

function scheduleNotification(item){

  const now =
    new Date();

  const parts =
    item.time.split(":");

  const hour =
    Number(parts[0]);

  const minute =
    Number(parts[1]);

  const target =
    new Date();

  target.setHours(
    hour,
    minute,
    0,
    0
  );

  if(target <= now){

    target.setDate(
      target.getDate() + 1
    );

  }

  const delay =
    target.getTime() -
    now.getTime();

  const maxDelay =
    2147483647;

  if(delay > maxDelay){

    notificationTimers[item.id] =
      setTimeout(
        () => {
          scheduleNotification(item);
        },
        maxDelay
      );

    return;

  }

  notificationTimers[item.id] =
    setTimeout(
      () => {

        showNotification(item);

        /* Daily notification */

        scheduleNotification(item);

      },
      delay
    );

}


/* =========================================
   SHOW NOTIFICATION
   ========================================= */

function showNotification(item){

  if(
    Notification.permission !==
    "granted"
  ){
    return;
  }

  new Notification(
    "Vitals Monitor",
    {
      body: item.message
    }
  );

}


/* =========================================
   START NOTIFICATION SYSTEM
   ========================================= */

renderNotifications();

/* =========================================
   START NOTIFICATION SYSTEM
========================================= */

</script>
